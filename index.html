<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Layer 2 — Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./viewer-layout.css" />
</head>
<body>
  <!-- ===== Top app bar ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand"><span class="brand-dot"></span>Layer2</span>
      <nav class="menu">
        <button type="button" class="menu-item" id="open-sources">모든 도구</button>
        <button type="button" class="menu-item">편집</button>
        <button type="button" class="menu-item">저장</button>
        <button type="button" class="menu-item">설정</button>
      </nav>
      <div class="nav-arrows">
        <button type="button" class="icon-btn" title="뒤로">←</button>
        <button type="button" class="icon-btn" title="앞으로">→</button>
      </div>
    </div>
    <div class="topbar-right">
      <div class="view-toggle" id="view-toggle" role="group" aria-label="읽기 레이아웃">
        <button type="button" data-mode="scroll" title="무한 스크롤">⤓ 스크롤</button>
        <button type="button" data-mode="spread" title="종이책 스프레드">▥ 스프레드</button>
      </div>
      <button type="button" class="icon-btn" title="검색">⌕</button>
      <button type="button" class="icon-btn" title="계정">◔</button>
      <button type="button" class="layer-ai-btn">Layer AI</button>
    </div>
  </header>

  <!-- ===== Workspace: left rail · stage · right rail ===== -->
  <div class="workspace">
    <nav class="rail rail-left" aria-label="tools">
      <button type="button" class="rail-btn" title="선택">⌖</button>
      <button type="button" class="rail-btn" title="코멘트">❏</button>
      <button type="button" class="rail-btn is-active" title="펜">✎</button>
      <button type="button" class="rail-btn" title="텍스트 삽입">⊞</button>
      <button type="button" class="rail-btn" title="텍스트 상자">A</button>
      <button type="button" class="rail-btn" title="그리기">✐</button>
      <button type="button" class="rail-btn" title="고정">⚲</button>
      <div class="rail-sep"></div>
      <button type="button" class="rail-btn is-active" id="hl-tool" title="하이라이트">◓</button>
      <button type="button" class="rail-btn" title="정렬">≡</button>
      <button type="button" class="rail-btn" title="더보기">⋯</button>

      <!-- Highlight color flyout (visual mock) -->
      <div class="color-popup" id="color-popup" hidden>
        <div class="color-popup-title">Highlight color</div>
        <div class="swatches">
          <button class="sw" style="--c:#3c3a37"></button>
          <button class="sw is-on" style="--c:#6f6a63"></button>
          <button class="sw" style="--c:#d7d2c8"></button>
          <button class="sw" style="--c:#b9b3a8"></button>
          <button class="sw" style="--c:#8a847a"></button>
          <button class="sw" style="--c:#6f6a63"></button>
          <button class="sw" style="--c:#4a4641"></button>
          <button class="sw" style="--c:#e7e2d8"></button>
          <button class="sw" style="--c:#cfc9be"></button>
          <button class="sw" style="--c:#a39d92"></button>
          <button class="sw" style="--c:#7d776d"></button>
          <button class="sw" style="--c:#56524c"></button>
          <button class="sw" style="--c:#ffffff;border-color:#cfc9be"></button>
          <button class="sw" style="--c:#dcd7cd"></button>
          <button class="sw" style="--c:#9b958b"></button>
          <button class="sw" style="--c:#5a564f"></button>
          <button class="sw" style="--c:#2c2a27"></button>
          <button class="sw" style="--c:#000000"></button>
        </div>
        <div class="opacity-row">
          <span>Opacity</span>
          <input type="range" min="0" max="100" value="40" />
          <span class="op-val">40%</span>
        </div>
      </div>
    </nav>

    <div class="stage" id="stage">
      <main id="reader" class="reader" aria-label="reader"></main>
    </div>

    <nav class="rail rail-right" aria-label="panels">
      <button type="button" class="rail-btn" title="AI 해석">✦</button>
      <button type="button" class="rail-btn" title="웹">◍</button>
      <button type="button" class="rail-btn" title="북마크">⌑</button>
      <button type="button" class="rail-btn" title="복사">▦</button>
      <button type="button" class="rail-btn" title="레이어">◆</button>
    </nav>
  </div>

  <!-- ===== Page navigation (spread mode only) ===== -->
  <div class="pagenav" id="pagenav" hidden>
    <button type="button" class="page-arrow" id="page-prev" title="이전">‹</button>
    <div class="page-count"><span id="page-cur">1</span><span class="page-sep"></span><span id="page-total">1</span></div>
    <button type="button" class="page-arrow" id="page-next" title="다음">›</button>
  </div>

  <!-- Legacy nodes kept so existing modules still find their hosts (hidden). -->
  <aside id="sidebar" class="sidebar" aria-label="sources"></aside>
  <aside id="dashboard" class="dashboard legacy-hidden" aria-label="signal dashboard"></aside>
  <div id="toolbar" class="toolbar legacy-hidden" aria-label="tools"></div>

  <!-- Global SVG layer for ink that flows past text bounds -->
  <svg id="ink-layer" class="ink-layer" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="annotation-host"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
