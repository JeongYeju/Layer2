<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 240px;
    margin: 0;
    padding: 14px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fbf9f4;
    color: #1c1a18;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1;
    padding: 9px 10px;
    font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
  }
  button.primary { border: 1px solid #d9362b; background: #d9362b; color: #fff; }
  button.secondary { border: 1px solid #d9362b; background: #fff; color: #d9362b; }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg {
    margin-top: 10px;
    font-size: 11px;
    color: #7a736b;
    min-height: 14px;
  }
  kbd {
    font-family: ui-monospace, monospace;
    font-size: 10px;
    background: #efeae0;
    border-radius: 3px;
    padding: 1px 4px;
  }
</style>
</head>
<body>
  <h1>📖 Layer2 Reader</h1>
  <div class="row">
    <button id="save" class="secondary" type="button">저장</button>
    <button id="go" class="primary" type="button">지금 읽기</button>
  </div>
  <div id="msg">저장하면 뷰어 웹의 "저장된 글" 목록에 담겨요.</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
