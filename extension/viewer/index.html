<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Layer 2 — Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./viewer-layout.css" />
</head>
<body>
  <!-- ===== Top app bar ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand"><span class="brand-dot"></span>Layer2</span>
      <nav class="menu">
        <button type="button" class="menu-item" id="open-sources">
          <i data-lucide="folder-open"></i> 모든 도구
        </button>
      </nav>
    </div>
    <div class="topbar-right">
      <div class="view-toggle" id="view-toggle" role="group" aria-label="읽기 레이아웃">
        <button type="button" data-mode="scroll" title="무한 스크롤">
          <i data-lucide="align-justify"></i> 스크롤
        </button>
        <button type="button" data-mode="spread" title="종이책 스프레드">
          <i data-lucide="book-open"></i> 스프레드
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Workspace: left rail · stage · right rail ===== -->
  <div class="workspace">
    <nav class="rail rail-left" aria-label="tools">
      <button type="button" class="rail-btn is-active" id="hl-tool" title="하이라이트 색상">
        <i data-lucide="highlighter"></i>
      </button>
      <div class="rail-sep"></div>
      <button type="button" class="rail-btn" id="reading-mode" title="독서 모드">
        <i data-lucide="glasses"></i>
      </button>

      <!-- Highlight color flyout -->
      <div class="color-popup" id="color-popup" hidden>
        <div class="color-popup-title">밑줄 색상</div>
        <div class="swatches">
          <button class="sw is-on" data-color="#d9362b" style="--c: #d9362b"></button>
          <button class="sw" data-color="#e8833a" style="--c: #e8833a"></button>
          <button class="sw" data-color="#e9c25a" style="--c: #e9c25a"></button>
          <button class="sw" data-color="#5aa469" style="--c: #5aa469"></button>
          <button class="sw" data-color="#3fa6a0" style="--c: #3fa6a0"></button>
          <button class="sw" data-color="#4d6ea3" style="--c: #4d6ea3"></button>
          <button class="sw" data-color="#5b5bd6" style="--c: #5b5bd6"></button>
          <button class="sw" data-color="#8a6fb0" style="--c: #8a6fb0"></button>
          <button class="sw" data-color="#cf6f9b" style="--c: #cf6f9b"></button>
          <button class="sw" data-color="#7a736b" style="--c: #7a736b"></button>
          <button class="sw" data-color="#4a4641" style="--c: #4a4641"></button>
          <button class="sw" data-color="#1c1a18" style="--c: #1c1a18"></button>
        </div>
        <div class="opacity-row">
          <span>불투명도</span>
          <input type="range" id="op-slider" min="20" max="100" value="100" />
          <span class="op-val" id="op-val">100%</span>
        </div>
      </div>
    </nav>

    <div class="stage" id="stage">
      <main id="reader" class="reader" aria-label="reader"></main>
    </div>

    <nav class="rail rail-right" aria-label="actions">
      <button type="button" class="rail-btn" id="btn-bookmark" title="북마크">
        <i data-lucide="bookmark"></i>
      </button>
      <button type="button" class="rail-btn" id="btn-capture" title="캡쳐">
        <i data-lucide="camera"></i>
      </button>
      <button type="button" class="rail-btn" id="btn-records" title="기록 / 대시보드">
        <i data-lucide="bar-chart-3"></i>
      </button>
    </nav>
  </div>

  <!-- ===== Page navigation (spread mode only) ===== -->
  <div class="pagenav" id="pagenav" hidden>
    <button type="button" class="page-arrow" id="page-prev" title="이전">
      <i data-lucide="chevron-left"></i>
    </button>
    <div class="page-count">
      <span id="page-cur">1</span><span class="page-sep"></span><span id="page-total">1</span>
    </div>
    <button type="button" class="page-arrow" id="page-next" title="다음">
      <i data-lucide="chevron-right"></i>
    </button>
  </div>

  <!-- Source panel + signal dashboard open as flyouts; floating toolbar unused. -->
  <aside id="sidebar" class="sidebar" aria-label="sources"></aside>
  <aside id="dashboard" class="dashboard" aria-label="signal dashboard"></aside>
  <div id="toolbar" class="toolbar legacy-hidden" aria-label="tools"></div>

  <!-- Global SVG layer for ink that flows past text bounds -->
  <svg id="ink-layer" class="ink-layer" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="annotation-host"></div>

  <script type="module" src="./boot-ext.js"></script>
</body>
</html>
